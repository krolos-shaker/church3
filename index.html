.panel{
  position:relative;
  z-index:2;
  width:100%;
  background:rgba(255,248,231,.96);
  border:1.5px solid rgba(163,112,30,.65);
  border-radius:26px;
  box-shadow:0 12px 32px rgba(74,42,15,.22);
  padding:22px 18px 24px;
  text-align:center;
}
.panel::before{
  content:"✝";
  display:block;
  color:#a36b16;
  font-size:25px;
  line-height:1;
  margin-bottom:8px;
}
.event-info{
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:1px solid rgba(155,104,29,.35);
}
.event-name{
  font-size:28px;
  font-weight:900;
  color:#8e1e22;
  margin-bottom:3px;
}
.meeting-name{
  font-size:20px;
  font-weight:800;
  color:#5a3219;
  margin-bottom:8px;
}
.meeting-time{
  display:inline-block;
  font-size:18px;
  font-weight:900;
  color:#9b681d;
  background:rgba(155,104,29,.10);
  border:1px solid rgba(155,104,29,.35);
  border-radius:12px;
  padding:7px 15px;
}
.message{
  font-size:18px;
  line-height:1.9;
  font-weight:700;
  color:#5a3219;
  margin-bottom:26px;
}
.message .headline{
  display:block;
  color:#8e1e22;
  font-size:25px;
  font-weight:900;
  margin-bottom:8px;
}
.verse-title{
  display:inline-block;
  color:#9b681d;
  font-size:16px;
  font-weight:900;
  border-top:1px solid rgba(155,104,29,.45);
  padding-top:12px;
  margin-top:10px;
}
#verse{
  font-size:22px;
  line-height:1.85;
  font-weight:800;
  color:#3f2818;
  margin:9px 0 5px;
}
#ref{
  font-size:16px;
  color:#806448;
  margin-bottom:14px;
}
button{
  border:0;
  border-radius:14px;
  padding:12px 24px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(90deg,#8c211f,#a52d26,#8c211f);
  color:#fff9ed;
  box-shadow:0 7px 16px rgba(93,30,20,.22);
}
button:active{transform:translateY(1px)}
.hint{
  margin-top:10px;
  font-size:12px;
  color:#8b7459;
}
@media(max-width:520px){
  .poster{
    width:100vw;
    min-height:150vw;
    padding-left:4%;
    padding-right:4%;
    padding-top:91%;
    padding-bottom:30px;
  }
  .panel{border-radius:22px;padding:18px 13px 20px}
  .event-name{font-size:24px}
  .meeting-name{font-size:18px}
  .meeting-time{font-size:16px;padding:6px 13px}
  .message{font-size:15.5px;line-height:1.85}
  .message .headline{font-size:22px}
  #verse{font-size:19px;line-height:1.75}
  #ref{font-size:14px}
  button{font-size:15px;padding:11px 20px}
}
</style>
</head>

<main class="poster">

  {text:"اِحْتَمِلُوا بَعْضُكُمْ بَعْضًا بِالْمَحَبَّةِ.",ref:"أفسس 4: 2",message:"المحبة تعلمنا نصبر على بعض."},
  {text:"لأَنَّنَا نَحْنُ عَمَلُهُ، مَخْلُوقِينَ فِي الْمَسِيحِ يَسُوعَ لأَعْمَالٍ صَالِحَةٍ.",ref:"أفسس 2: 10",message:"أنت مخلوق بقصد وليك رسالة."},
  {text:"فَوْقَ كُلِّ شَيْءٍ، خُذُوا تُرْسَ الإِيمَانِ الَّذِي بِهِ تَقْدِرُونَ أَنْ تُطْفِئُوا جَمِيعَ سِهَامِ الشِّرِّيرِ الْمُلْتَهِبَةِ.",ref:"أفسس 6: 16",message:"تمسك بالإيمان وقت الهجوم والخوف."},
  {text:"اِفْرَحُوا فِي الرَّبِّ كُلَّ حِينٍ، وَأَقُولُ أَيْضًا: افْرَحُوا.",ref:"فيلبي 4: 4",message:"فرحك الحقيقي مرتبط بالرب."},
  {text:"لاَ تَهْتَمُّوا بِشَيْءٍ، بَلْ فِي كُلِّ شَيْءٍ بِالصَّلاَةِ وَالدُّعَاءِ مَعَ الشُّكْرِ، لِتَعْلَمْ طِلْبَاتُكُمْ لَدَى اللهِ.",ref:"فيلبي 4: 6",message:"حوّل قلقك لصلاة."},
  {text:"وَسَلاَمُ اللهِ الَّذِي يَفُوقُ كُلَّ عَقْلٍ يَحْفَظُ قُلُوبَكُمْ وَأَفْكَارَكُمْ.",ref:"فيلبي 4: 7",message:"سلام ربنا يقدر يحفظ قلبك وفكرك."},
  {text:"كُلُّ مَا هُوَ حَقٌّ، كُلُّ مَا هُوَ جَلِيلٌ، كُلُّ مَا هُوَ عَادِلٌ، كُلُّ مَا هُوَ طَاهِرٌ، كُلُّ مَا هُوَ مُسِرٌّ، كُلُّ مَا صِيتُهُ حَسَنٌ، فَفِي هذِهِ افْتَكِرُوا.",ref:"فيلبي 4: 8",message:"املأ فكرك بالحاجات الصالحة."},
  {text:"وَإِلهِي يَمْلأُ كُلَّ احْتِيَاجِكُمْ بِحَسَبِ غِنَاهُ فِي الْمَجْدِ فِي الْمَسِيحِ يَسُوعَ.",ref:"فيلبي 4: 19",message:"ثق إن ربنا عارف احتياجك."},
  {text:"الرَّبُّ قَرِيبٌ. لاَ تَهْتَمُّوا بِشَيْءٍ.",ref:"فيلبي 4: 5-6",message:"افتكر دايمًا إن الرب قريب."},
  {text:"اِحْسِبُوهُ كُلَّ فَرَحٍ يَا إِخْوَتِي حِينَمَا تَقَعُونَ فِي تَجَارِبَ مُتَنَوِّعَةٍ.",ref:"يعقوب 1: 2",message:"حتى التجارب ممكن تكون طريق للنمو."},
  {text:"وَإِنَّمَا إِنْ كَانَ أَحَدُكُمْ تُعْوِزُهُ حِكْمَةٌ، فَلْيَطْلُبْ مِنَ اللهِ.",ref:"يعقوب 1: 5",message:"لما تحتار، اطلب حكمة من ربنا."},
  {text:"تَوَاضَعُوا قُدَّامَ الرَّبِّ فَيَرْفَعَكُمْ.",ref:"يعقوب 4: 10",message:"التواضع قدام ربنا يرفعك في الوقت المناسب."},
  {text:"أَلْقُوا كُلَّ هَمِّكُمْ عَلَيْهِ لأَنَّهُ هُوَ يَعْتَنِي بِكُمْ.",ref:"1 بطرس 5: 7",message:"ربنا مهتم بكل تفصيلة في حياتك."},
  {text:"وَإِلهُ كُلِّ نِعْمَةٍ... بَعْدَمَا تَأَلَّمْتُمْ يَسِيرًا، هُوَ يُكَمِّلُكُمْ وَيُثَبِّتُكُمْ وَيُقَوِّيكُمْ وَيُمَكِّنُكُمْ.",ref:"1 بطرس 5: 10",message:"بعد الألم ربنا يقدر يكملك ويثبتك."},
  {text:"نَحْنُ نُحِبُّهُ لأَنَّهُ هُوَ أَحَبَّنَا أَوَّلاً.",ref:"1 يوحنا 4: 19",message:"محبتنا لربنا بدأت من محبته لينا."},
  {text:"اللهُ مَحَبَّةٌ، وَمَنْ يَثْبُتْ فِي الْمَحَبَّةِ يَثْبُتْ فِي اللهِ وَاللهُ فِيهِ.",ref:"1 يوحنا 4: 16",message:"اثبت في المحبة، اثبت في الله."},
  {text:"لاَ نَكُنْ بِالْكَلاَمِ وَلاَ بِاللِّسَانِ، بَلْ بِالْعَمَلِ وَالْحَقِّ.",ref:"1 يوحنا 3: 18",message:"خلّي محبتك تظهر في أفعالك."},
  {text:"أَمَّا الَّذِينَ يَنْتَظِرُونَ الرَّبَّ فَيُجَدِّدُونَ قُوَّةً.",ref:"إشعياء 40: 31",message:"الانتظار مع ربنا بيجدد قوتك."},
  {text:"أَمَا أَوْصَيْتُكَ؟ تَشَدَّدْ وَتَشَجَّعْ! لاَ تَرْهَبْ وَلاَ تَرْتَعِبْ.",ref:"يشوع 1: 9",message:"خد خطوة الإيمان ومتخافش."},
  {text:"هُوَذَا مَا أَطْيَبَ وَمَا أَحْلَى أَنْ يَسْكُنَ الإِخْوَةُ مَعًا!",ref:"مزمور 133: 1",message:"الوحدة والمحبة نعمة عظيمة."}
];

let last = -1;

function showRandomVerse(){
  let i;
  do { i = Math.floor(Math.random() * verses.length); }
  while(verses.length > 1 && i === last);
  last = i;

  document.getElementById("verse").textContent = "«" + verses[i].text + "»";
  document.getElementById("ref").textContent = "— " + verses[i].ref;
}

showRandomVerse();

</script>
